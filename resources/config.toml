[launcher]
max_visible_results = 7
font_family = ""
font_size = 14
small_font_size = 13
tiny_font_size = 10

[launcher.window]
anchor = "top"
width = 580
height = 316
margin = 320

[providers.apps]
enabled = true

[providers.commands]
enabled = true
cmds = []

[providers.files]
enabled = true
editor_command = ""
open_command = "xdg-open"

[providers.projects]
enabled = true
roots = ["~/dev/projects"]
kitty_command = "kitty"
kitty_remote = "auto"

[providers.web_search]
enabled = true
browser_command = ""
